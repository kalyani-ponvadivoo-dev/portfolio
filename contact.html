<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="section-one">
            <h1 class="section-one__name"> Kalyani ponvadivoo </h1>
            <p class="section-one__designation">Web Developer</p>
            <a class="section-one__contact" href="index.html">Home</a>
        </div>
        <div class="contact-form">
        <form>
            <table>
                <tr>
                    <td>
                        <label>Name:</label>
                    </td>
                    <td>
                        <input type="text" placeholder="Enter your name" class="contact-form__input">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>Email:</label>
                    </td>
                    <td>
                        <input type="email" placeholder="Enter your Email" class="contact-form__input">
                    </td>
                </tr>
                <!-- <tr>
                    <td>
                        <label>Age</label>
                    </td>
                    <td>
                        <input type="number" placeholder="Enter your Age">
                    </td>
                </tr> -->
                <tr>
                    <td>
                        <label>Message</label>
                    </td>
                    <td>
                        <textarea name="Message" rows="3" cols="30" placeholder="Enter your Message here..." class="contact-form__textarea"></textarea>
                        </textarea>
                    </td>
                </tr>
                <tr>
                    <td>

                    </td>
                    <td>
                        <input type="submit" class="contact-form__submit">

                    </td>
                </tr>
            </table>
        </form>
        </div>
        <div class="section-five">
            <p class="section-five__desc">Social Media: <a
                    href="https://www.instagram.com/kalyanithangavel?exln=MWM1NzRoODI2NThjcQ%3D%3D&utm_source=qr">Instagram</a><a
                    href="https://www.linkedin.com/in/kalyani-thangavelu-9b7a0210b">LinkedIn</a></p>
            <p>&copy; Kalyani</p>
        </div>
    </div>
</body>

</html>
